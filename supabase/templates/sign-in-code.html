<!doctype html>
<html lang="en">
  <body style="margin:0;padding:32px 16px;background:#f7f7f8;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;color:#1a1a1f;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background:#ffffff;border:1px solid #e6e6ea;border-radius:14px;">
            <tr>
              <td style="padding:28px;">
                <p style="margin:0 0 4px;font-size:13px;font-weight:600;letter-spacing:.04em;color:#4f46e5;">DAYQUEST</p>
                <h1 style="margin:0 0 16px;font-size:20px;">Your sign-in code</h1>
                <p style="margin:0 0 8px;font-size:15px;color:#62626d;">Enter this code to continue your quest:</p>
                <p style="margin:0 0 20px;font-size:32px;font-weight:700;letter-spacing:.3em;font-family:ui-monospace,Menlo,monospace;">{{ .Token }}</p>
                <p style="margin:0;font-size:13px;color:#62626d;">It expires in 10 minutes. If you didn't ask for it, you can ignore this email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
